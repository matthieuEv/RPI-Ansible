---
- name: Install dnsmasq
  apt:
    name: dnsmasq
    state: present
    update_cache: yes

- name: Stop systemd-resolved if running (conflicts with dnsmasq)
  systemd:
    name: systemd-resolved
    state: stopped
    enabled: no
  ignore_errors: yes

- name: Deploy dnsmasq configuration
  template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.d/split-dns.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart dnsmasq

- name: Ensure dnsmasq listens on WireGuard interface
  template:
    src: dnsmasq-wireguard.conf.j2
    dest: /etc/dnsmasq.d/wireguard.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart dnsmasq

- name: Ensure dnsmasq starts after WireGuard is ready
  copy:
    dest: /etc/systemd/system/dnsmasq.service.d/override.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      After=network-online.target wg-quick@{{ wireguard.interface }}.service
      Wants=network-online.target
      Requires=wg-quick@{{ wireguard.interface }}.service

      [Service]
      ExecStartPre=/bin/sh -c 'for i in $(seq 1 20); do ip -4 addr show dev {{ wireguard.interface }} | grep -q "{{ wireguard.server_ip }}" && exit 0; sleep 1; done; echo "{{ wireguard.interface }} with {{ wireguard.server_ip }} not ready"; exit 1'
  notify:
    - Reload systemd
    - Restart dnsmasq

- name: Enable dnsmasq service
  systemd:
    name: dnsmasq
    enabled: yes
    state: started
