---
- name: Install dnsmasq
  apt:
    name: dnsmasq
    state: present
    update_cache: yes

- name: Stop systemd-resolved if running (conflicts with dnsmasq)
  systemd:
    name: systemd-resolved
    state: stopped
    enabled: no
  ignore_errors: yes

- name: Deploy dnsmasq configuration
  template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.d/split-dns.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart dnsmasq

- name: Ensure dnsmasq listens on WireGuard interface
  template:
    src: dnsmasq-wireguard.conf.j2
    dest: /etc/dnsmasq.d/wireguard.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart dnsmasq

- name: Remove old dnsmasq override causing systemd ordering cycle
  file:
    path: /etc/systemd/system/dnsmasq.service.d/override.conf
    state: absent
  notify:
    - Reload systemd
    - Restart dnsmasq

- name: Deploy dnsmasq rebind service after WireGuard startup
  copy:
    dest: /etc/systemd/system/dnsmasq-rebind-after-wg.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Restart dnsmasq after WireGuard is up
      After=wg-quick@{{ wireguard.interface }}.service dnsmasq.service
      Wants=wg-quick@{{ wireguard.interface }}.service dnsmasq.service

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'for i in $(seq 1 20); do ip -4 addr show dev {{ wireguard.interface }} | grep -q "{{ wireguard.server_ip }}" && exec systemctl restart dnsmasq.service; sleep 1; done; echo "{{ wireguard.interface }} with {{ wireguard.server_ip }} not ready"; exit 1'

      [Install]
      WantedBy=multi-user.target
  notify:
    - Reload systemd

- name: Enable dnsmasq service
  systemd:
    name: dnsmasq
    enabled: yes
    state: started

- name: Enable dnsmasq rebind service
  systemd:
    name: dnsmasq-rebind-after-wg.service
    enabled: yes
    state: started
    daemon_reload: yes
